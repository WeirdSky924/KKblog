x-production-environment: &production-environment
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  KAJ_PUBLIC_URL: ${KAJ_PUBLIC_URL:?KAJ_PUBLIC_URL is required}
  KAJ_ADMIN_EMAIL: ${KAJ_ADMIN_EMAIL:?KAJ_ADMIN_EMAIL is required}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}
  EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST is required}
  EMAIL_PORT: ${EMAIL_PORT:?EMAIL_PORT is required}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:?EMAIL_USE_TLS is required}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:?EMAIL_USE_SSL is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  KAJ_MEDIA_ROOT: ${KAJ_MEDIA_ROOT:?KAJ_MEDIA_ROOT is required}
  KAJ_INITIAL_ADMIN_PASSWORD: ${KAJ_INITIAL_ADMIN_PASSWORD:?KAJ_INITIAL_ADMIN_PASSWORD is required}
  KAJ_TRUSTED_PROXY_CIDRS: ${KAJ_TRUSTED_PROXY_CIDRS:?KAJ_TRUSTED_PROXY_CIDRS is required}
  KAJ_UMAMI_DATABASE_URL: ${KAJ_UMAMI_DATABASE_URL:?KAJ_UMAMI_DATABASE_URL is required}
  KAJ_UMAMI_WEBSITE_ID: ${KAJ_UMAMI_WEBSITE_ID:?KAJ_UMAMI_WEBSITE_ID is required}

services:
  web:
    environment: *production-environment

  worker:
    environment: *production-environment

  beat:
    environment: *production-environment

  caddy:
    environment:
      KAJ_RUNTIME_ENV: production
      KAJ_PUBLIC_HOST: ${KAJ_PUBLIC_HOST:?KAJ_PUBLIC_HOST is required}
      KAJ_PUBLIC_URL: ${KAJ_PUBLIC_URL:?KAJ_PUBLIC_URL is required}
      KAJ_CADDY_UPSTREAM: web:8000
      KAJ_UMAMI_UPSTREAM: umami:3000
    ports: !override
      - name: public-http
        target: 80
        published: 80
        host_ip: 0.0.0.0
        protocol: tcp
      - name: public-https
        target: 443
        published: 443
        host_ip: 0.0.0.0
        protocol: tcp

  umami:
    environment:
      DATABASE_URL: ${KAJ_UMAMI_DATABASE_URL:?KAJ_UMAMI_DATABASE_URL is required}
      APP_SECRET: ${KAJ_UMAMI_APP_SECRET:?KAJ_UMAMI_APP_SECRET is required}
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$(printf %s "$$APP_SECRET" | wc -c | tr -d ' ')" -lt 32 ]; then
          echo "APP_SECRET must be at least 32 characters" >&2
          exit 1
        fi
        exec pnpm start-docker
