name: kaj-blog

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
  DATABASE_URL: ${DATABASE_URL:-postgresql://kaj:kaj-local-only@postgres:5432/kaj}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  EMAIL_HOST: ${EMAIL_HOST:-mailpit}
  EMAIL_PORT: ${EMAIL_PORT:-1025}
  KAJ_TRUSTED_PROXY_CIDRS: ${KAJ_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  KAJ_UMAMI_DATABASE_URL: ${KAJ_UMAMI_DATABASE_URL:-}
  KAJ_UMAMI_WEBSITE_ID: ${KAJ_UMAMI_WEBSITE_ID:-}

x-app-service: &app-service
  image: ${KAJ_WEB_IMAGE:-kaj-blog-web:local}
  restart: unless-stopped
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  environment: *app-environment
  volumes:
    - type: bind
      source: ./var/media
      target: /app/var/media
    - type: bind
      source: ./var/backups
      target: /app/var/backups
  networks:
    - frontend
    - backend

services:
  web:
    <<: *app-service
    volumes:
      - type: bind
        source: ./var/media
        target: /app/var/media
      - type: bind
        source: ./var/staticfiles
        target: /app/var/staticfiles
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        PYTHON_IMAGE: ${KAJ_PYTHON_IMAGE:-python:3.12-slim-bookworm}
        NODE_IMAGE: ${KAJ_NODE_IMAGE:-node:22-bookworm-slim}
        UV_IMAGE: ${KAJ_UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.30}
        UV_DEFAULT_INDEX: ${KAJ_UV_DEFAULT_INDEX:-https://pypi.org/simple}
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=2
      - --no-control-socket
      - --access-logfile=-
      - --error-logfile=-
      - config.wsgi:application
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          response = urlopen("http://127.0.0.1:8000/health/ready", timeout=2);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app-service
    command:
      - python
      - -m
      - celery
      - -A
      - config.celery
      - worker
      - --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -m celery -A config.celery inspect ping
          --destination celery@$$HOSTNAME --timeout 3 >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  beat:
    <<: *app-service
    command:
      - python
      - -m
      - celery
      - -A
      - config.celery
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: ${KAJ_POSTGRES_IMAGE:-kaj-blog-postgres:local}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        POSTGRES_IMAGE: ${KAJ_POSTGRES_BASE_IMAGE:-postgres:16-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KAJ_POSTGRES_DB:-kaj}
      POSTGRES_USER: ${KAJ_POSTGRES_USER:-kaj}
      POSTGRES_PASSWORD: ${KAJ_POSTGRES_PASSWORD:-kaj-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - type: bind
        source: ./var/postgres
        target: /var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: ${KAJ_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - type: bind
        source: ./var/redis
        target: /data
    networks:
      - backend

  caddy:
    image: ${KAJ_CADDY_IMAGE:-kaj-blog-caddy:local}
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        CADDY_IMAGE: ${KAJ_CADDY_BASE_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      KAJ_RUNTIME_ENV: ${KAJ_RUNTIME_ENV:-development}
      KAJ_CADDY_UPSTREAM: ${KAJ_CADDY_UPSTREAM:-web:8000}
      KAJ_WEB_HOST: ${KAJ_WEB_HOST:-localhost}
      KAJ_WEB_PROTO: ${KAJ_WEB_PROTO:-http}
      KAJ_UMAMI_UPSTREAM: ${KAJ_UMAMI_UPSTREAM:-umami:3000}
    ports:
      - name: local-http
        target: 80
        published: ${KAJ_HTTP_PORT:-80}
        host_ip: 127.0.0.1
        protocol: tcp
    expose:
      - "80"
      - "443"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - "--header=Host: localhost"
        - http://127.0.0.1/health/ready
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./var/caddy/data
        target: /data
      - type: bind
        source: ./var/caddy/config
        target: /config
      - type: bind
        source: ./var/staticfiles
        target: /srv/static
        read_only: true
      - type: bind
        source: ./var/media
        target: /srv/media
        read_only: true
    networks:
      - frontend
      - analytics

  umami:
    image: ${KAJ_UMAMI_IMAGE:-ghcr.io/umami-software/umami:postgresql-v2.19.0}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${KAJ_UMAMI_DATABASE_URL:-postgresql://kaj:kaj-local-only@postgres:5432/umami}
      APP_SECRET: ${KAJ_UMAMI_APP_SECRET:-kaj-local-umami-secret}
      COLLECT_API_ENDPOINT: /analytics/collect
      TRACKER_SCRIPT_NAME: analytics/script.js
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/heartbeat')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    expose:
      - "3000"
    networks:
      - backend
      - analytics

  mailpit:
    image: ${KAJ_MAILPIT_IMAGE:-axllent/mailpit:v1.30.5}
    restart: unless-stopped
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "0"
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "1025"
      - "8025"
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  analytics:
    driver: bridge
    internal: true
