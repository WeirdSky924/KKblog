<ul
  class="public-navigation__list{% if nested %} public-navigation__list--nested{% endif %}"
>
  {% for item in items %}
    <li class="public-navigation__item{% if item.children %} public-navigation__item--parent{% endif %}">
      <a
        href="{{ item.url }}"
        {% if item.external %}target="_blank" rel="noopener noreferrer"{% endif %}
      >
        <span>{{ item.label }}</span>
        {% if item.external %}<i data-lucide="external-link"></i>{% endif %}
      </a>
      {% if item.children %}
        {% include "components/navigation/navigation_items.html" with items=item.children nested=True only %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
