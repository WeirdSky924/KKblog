{% if page_data and page_data.pages > 1 %}
  <nav class="opportunity-admin__pagination" aria-label="{{ pagination_label|default:'分页' }}">
    {% if page_data.page > 1 %}<a class="button button--secondary" href="?{{ pagination_query }}&amp;page={{ page_data.page|add:'-1' }}"><i data-lucide="chevron-left"></i><span>上一页</span></a>{% endif %}
    <span>第 {{ page_data.page }} / {{ page_data.pages }} 页</span>
    {% if page_data.page < page_data.pages %}<a class="button button--secondary" href="?{{ pagination_query }}&amp;page={{ page_data.page|add:'1' }}"><span>下一页</span><i data-lucide="chevron-right"></i></a>{% endif %}
  </nav>
{% endif %}
