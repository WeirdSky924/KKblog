<nav
  class="administration-navigation administration-navigation--{{ navigation_variant }}"
  aria-label="管理模块"
>
  {% for group in admin_navigation_groups %}
    <section class="administration-navigation__group" aria-labelledby="admin-nav-{{ navigation_variant }}-{{ forloop.counter }}">
      <h2 id="admin-nav-{{ navigation_variant }}-{{ forloop.counter }}">
        <span class="administration-navigation__group-index" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>
        <span>{{ group.label }}</span>
      </h2>
      <ul>
        {% for item in group.items %}
          <li>
            <a
              href="{{ item.url }}"
              data-admin-navigation-key="{{ item.key }}"
              {% if item.review_count %}class="administration-navigation__link--review"{% endif %}
              {% if item.route_name == admin_current_route and item.query_string == admin_current_query %}aria-current="page"{% endif %}
            >
              <span class="administration-navigation__item-label">{{ item.label }}</span>
              {% if item.review_count %}
                <span class="administration-navigation__review-count" aria-label="{{ item.review_count }} 项待处理">
                  <span aria-hidden="true">{{ item.review_count }}</span>
                </span>
              {% endif %}
            </a>
          </li>
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
</nav>
