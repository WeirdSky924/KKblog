<!doctype html>
<html lang="zh-Hans">
  <body style="margin:0;background:#f7f7f8;color:#202124;font-family:Arial,sans-serif">
    <main style="max-width:600px;margin:36px auto;padding:32px;background:#fff;border:1px solid #d9d9dc;border-top:4px solid #7e2637">
      <p style="color:#7e2637;font-weight:700">{{ site_name }}</p>
      <h1 style="font-size:24px">重置账户密码</h1>
      <p>管理员已为你的账户发起密码重置。请在 {{ minutes }} 分钟内使用下方按钮设置新密码。</p>
      <p><a href="{{ reset_url }}" style="display:inline-block;padding:12px 18px;background:#7e2637;color:#fff;text-decoration:none">设置新密码</a></p>
      <p>设置成功后，账户在所有设备上的现有登录会话都会退出。</p>
      <p>若不是你本人操作，请联系管理员；本链接可以忽略。</p>
    </main>
  </body>
</html>
