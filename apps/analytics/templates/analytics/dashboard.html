{% extends "base.html" %}

{% block title %}访问分析 · {{ site_presentation.site_name }}{% endblock %}

{% block main_class %}site-main analytics-main{% endblock %}

{% block content %}
  <section class="analytics-page" aria-labelledby="analytics-title">
    <header class="analytics-header">
      <p>管理 · 分析</p>
      <h1 id="analytics-title">访问分析</h1>
      <span>Umami</span>
    </header>
    {% if analytics_enabled %}
      <div class="analytics-viewport">
        <iframe
          src="/admin/analytics/umami/"
          title="Umami 访问分析"
          loading="eager"
        ></iframe>
      </div>
    {% else %}
      <div class="analytics-unavailable" role="status">
        <h2>分析服务未配置</h2>
        <p>当前无法显示分析数据。</p>
      </div>
    {% endif %}
  </section>
{% endblock %}
