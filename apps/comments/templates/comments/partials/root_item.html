<li id="comment-{{ item.id }}" class="comment-item comment-item--root{% if item.is_pinned %} comment-item--pinned{% endif %}" data-comment-id="{{ item.id }}">
  {% include "comments/partials/comment_content.html" %}
  {% if item.reply_page.items or item.reply_page.next_cursor %}
    <ol
      id="comment-replies-{{ item.id }}"
      class="comment-replies"
      aria-label="{{ item.author.label }}的{{ comment_noun }}回复"
    >
      {% include "comments/partials/reply_batch.html" with reply_page=item.reply_page comment_root_id=item.id %}
    </ol>
  {% endif %}
</li>
