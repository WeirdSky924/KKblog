{% extends "base.html" %}

{% block title %}{{ static_page.title }} · {{ site_presentation.site_name }}{% endblock %}

{% block content %}
  <article class="public-static-page" aria-labelledby="static-page-title">
    <header class="public-static-page__header">
      <p class="eyebrow">站点信息</p>
      <h1 id="static-page-title">{{ static_page.title }}</h1>
      <time datetime="{{ static_page.updated_at|date:'c' }}">更新于 {{ static_page.updated_at|date:'Y-m-d' }}</time>
    </header>
    <div class="article-prose public-static-page__body">{{ static_page.html|safe }}</div>
  </article>
{% endblock %}
